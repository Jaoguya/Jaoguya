</div>
<canvas id="bubbles" aria-hidden="true"></canvas>

<header id="bar">
  <p id="brand"><span class="logo" aria-hidden="true"></span>Tagrid's Desktop</p>
  <nav id="links" aria-label="Contact">
    <a href="https://github.com/Jaoguya" target="_blank" rel="noopener">GitHub</a>

  </nav>

<main id="desk">

      <span class="f-paper"></span>

    </span>

<p id="live" role="status" aria-live="polite" class="sr"></p>

<div id="win" hidden>
  <div id="win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div id="win-bar">
      <button id="win-close" class="dot" type="button" aria-label="Close"></button>
      <span class="dot" aria-hidden="true"></span>
      <span class="dot" aria-hidden="true"></span>
      <h2 id="win-title"></h2>
    </div>
    <div id="win-body">
      <div id="win-info"></div>
      <section id="win-readme-wrap">
        <h3>README</h3>
        <div id="win-readme" class="readme"></div>
      </section>
    </div>
  </div>
